[package]
org = "cliptown"
name = "cliptown-mcp-server"
version = "0.1.0"
description = "Hardened read-only MCP diagnostics for the cliptown GitHub organization"
license = "MIT"
keywords = ["mcp", "diagnostics", "agents", "global-tool", "rust"]
language = "rust"

[package.repository]
vcs = "git"
url = "https://github.com/cliptown/cliptown-mcp-server.rs"

[dependencies]
"oresoftware/mcp-rust-libs" = "^0.1.0"
"ores-otel/ores-mcp-server-core-libs" = "^0.1.0"
"shared-auth/shared-auth-clients" = "^0.1.0"
"shared-auth/shared-auth-interfaces" = "^0.1.0"
"shared-auth/shared-auth-lib" = "^0.1.0"
"zed-pkg/zed-cli" = "^0.2.3"

[build]
command = "cargo build --release --locked --bin cliptown-mcp-server"
outputs = ["target/release/cliptown-mcp-server"]

[bin]
cliptown-mcp-server = "target/release/cliptown-mcp-server"

[publish]
include_readme = true
tag_format = "v{version}"
smoke_test = "cargo test --manifest-path \"$ZED_PKG_TEST_TARGET/Cargo.toml\" --all-targets --locked && test -x \"$ZED_PKG_TEST_TARGET/target/release/cliptown-mcp-server\""
exclude = [".env", ".env.*", ".direnv/**", ".vendor/.zed/**", ".zed/**", ".zpkg.lock", ".zed-pack/**", "env/dec/**", "target/**", "tmp/**", "**/*.log", ".DS_Store"]

[install]
adapter = "none"
dir = ".vendor/.zed"

[scripts]
test = "cargo test --all-targets --locked"
