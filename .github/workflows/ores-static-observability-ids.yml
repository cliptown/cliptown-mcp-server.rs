# Enforce grep-friendly, hardcoded ORES observability identifiers.
# Routine IDs live at function entry; trace IDs stay inline at log call sites.
name: ORES static observability IDs

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  ores-static-observability-ids:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Fetch pinned ORES trace contract checker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/ores-otel/ores.otel.log/fd394464b022758575ba0fa60ce8e13b92175e95/.github/ores-trace-contract.rs \
            --output "$RUNNER_TEMP/ores-trace-contract.rs"

      - name: Build checker
        shell: bash
        run: rustc --edition=2021 -D warnings -O -o "$RUNNER_TEMP/ores-trace-contract" "$RUNNER_TEMP/ores-trace-contract.rs"

      - name: Self-test checker
        shell: bash
        run: |
          rustc --edition=2021 -D warnings --test -o "$RUNNER_TEMP/ores-trace-contract-test" "$RUNNER_TEMP/ores-trace-contract.rs"
          "$RUNNER_TEMP/ores-trace-contract-test"

      - name: Verify static ORES IDs
        shell: bash
        run: "$RUNNER_TEMP/ores-trace-contract" .
