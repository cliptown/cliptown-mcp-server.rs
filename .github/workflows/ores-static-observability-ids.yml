# Enforce grep-friendly, hardcoded ORES observability identifiers:
# - ores-routine-* is function-scoped and declared at function entry.
# - ores-trace-* stays inline at each logging call site.
name: ORES static observability IDs

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ores-static-observability-ids:
    uses: ores-otel/ores.otel.log/.github/workflows/ores-trace-contract-reusable.yml@a90638c5dba2a59b1b77c9c55d4c60829b4480d8
