[package]
name = "cliptown-mcp-server"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
license = "MIT"
description = "Hardened read-only MCP server for the cliptown GitHub organization"
publish = false

[[bin]]
name = "cliptown-mcp-server"
path = "src/main.rs"

[[bin]]
name = "cliptown-mcp-http"
path = "src/http.rs"

[dependencies]
ore-mcp-org-server = { git = "https://github.com/ORESoftware/mcp-rust-libs", rev = "046584b6e1138d4d9b141b48a66dca1d510ee52c" }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
